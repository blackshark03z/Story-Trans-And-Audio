name: Story Audio Product CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    env:
      STORY_AUDIO_BROWSER_TIMEOUT_MS: '45000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node when needed
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack for pnpm/yarn
        if: ${{ hashFiles('pnpm-lock.yaml') != '' || hashFiles('yarn.lock') != '' }}
        run: corepack enable
      - name: Set up uv when needed
        if: ${{ hashFiles('uv.lock') != '' }}
        uses: astral-sh/setup-uv@v6
      - name: Install Poetry when needed
        if: ${{ hashFiles('poetry.lock') != '' }}
        run: python -m pip install poetry
      - name: Install media runtime
        shell: powershell
        run: |
          choco install ffmpeg --yes --no-progress
          ffmpeg -version
      - name: Install project dependencies from canonical/autodetected command
        run: python scripts/project_ci.py --install --ci
      - name: Locate Chromium for browser acceptance
        shell: powershell
        run: |
          $browserPath = @(
            'C:\Program Files\Google\Chrome\Application\chrome.exe',
            'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe',
            'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $browserPath) { throw 'No Chromium browser found on the CI runner.' }
          "STORY_AUDIO_BROWSER_EXE=$browserPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run canonical product checks (fail closed)
        run: python scripts/project_ci.py --ci
